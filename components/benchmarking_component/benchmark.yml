$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
type: command
name: benchmark_step
display_name: Benchmarking
description: Comparing multiple models using Cross Validation and KFold on the Diabetes T1 dataset

inputs:
  data_dir:
    type: uri_folder
  min_age:
    type: integer
    default: 2
  max_age:
    type: integer
    default: 18
  n_folds:
    type: integer
    default: 5
  n_repeats:
    type: integer
    default: 5
  train_size:
    type: number
    default: 0.7
  patient_wise_threshold:
    type: number
  exam_wise_threshold:
    type: number
  sig_p_threshold:
    type: number
    default: 0.05
  drop_order:
    type: string
    default: patients_first
    enum:
      - features_first
      - patients_first


outputs:
  output_dir:
    type: uri_folder
    mode: rw_mount

code: .
environment: azureml:base-env-3-9-shap@latest
command: >
  python benchmark.py 
  --data_dir ${{inputs.data_dir}} 
  --min_age ${{inputs.min_age}}
  --max_age ${{inputs.max_age}}
  --n_folds ${{inputs.n_folds}}
  --n_repeats ${{inputs.n_repeats}}
  --train_size ${{inputs.train_size}}
  --output_dir ${{outputs.output_dir}} 
  --patient_wise_threshold ${{inputs.patient_wise_threshold}}  
  --exam_wise_threshold ${{inputs.exam_wise_threshold}}
  --sig_p_threshold ${{inputs.sig_p_threshold}}
  --drop_order ${{inputs.drop_order}}